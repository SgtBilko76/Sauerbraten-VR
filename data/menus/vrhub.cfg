//##############################################################################################################################################################
//  SauVREngine: menú VR nativo. Una pantalla para elegir mapa y lo básico de una partida de bots,
//  con botones grandes para el láser del mando. Diseño: docs/superpowers/specs/2026-11-02-menu-vr-nativo-design.md
//##############################################################################################################################################################
// GUI_BotCount / GUI_MinSkill / GUI_MaxSkill vienen de data/menus.cfg (bloque botmatch):
// este archivo debe ejecutarse después de ese bloque.
nodebug [
    defvar    VRHub_MapIndex 0 0 1
    defvar    VRHub_Comfort  0 0 1
    defsvar   VRHub_Maps     "duel7 ruebli"
]

VRHub_MapCount = (listlen $VRHub_Maps)
VRHub_MapName  = [at $VRHub_Maps $VRHub_MapIndex]
VRHub_Prev     = [VRHub_MapIndex = (mod (- (+ $VRHub_MapIndex $VRHub_MapCount) 1) $VRHub_MapCount)]
VRHub_Next     = [VRHub_MapIndex = (mod (+ $VRHub_MapIndex 1) $VRHub_MapCount)]
VRHub_Play     = [GUI__StartBotMatchWithMap (VRHub_MapName)]
VRHub_ToggleComfort = [VRHub_Comfort = (! $VRHub_Comfort)]

newgui "vrhub" [
    guiscale 1.1

    guilist [// H
        guilist [// V
            guiimage (concatword "packages/base/" (VRHub_MapName) ".jpg") [VRHub_Play] 6 1 "data/cube.png" (VRHub_MapName)
            guilist [// H
                guibutton "<  anterior" [VRHub_Prev] 0
                guistrut 2
                guitext (concatword "^f2" (VRHub_MapName)) 0
                guistrut 2
                guibutton "siguiente  >" [VRHub_Next] 0
            ]
        ]
        guistrut 1
        guilist [// V
            guitext "^f2Partida de bots (FFA)" 0
            guistrut 0.5
            guilist [ guitext "bots: " ; guislider GUI_BotCount 1 32 ]
            guilist [ guitext "habilidad minima: " ; guislider GUI_MinSkill 50 101 [if (< $GUI_MaxSkill $GUI_MinSkill) [GUI_MaxSkill = $GUI_MinSkill]] ]
            guilist [ guitext "habilidad maxima: " ; guislider GUI_MaxSkill 50 101 [if (> $GUI_MinSkill $GUI_MaxSkill) [GUI_MinSkill = $GUI_MaxSkill]] ]
        ]
    ]

    guibar
    guibutton "^f2JUGAR" [VRHub_Play] 0
    guistrut 1
    guibutton (? $VRHub_Comfort "^f7Confort  (ocultar)" "^f7Confort  (mostrar)") [VRHub_ToggleComfort] 0
    guibutton "^f7Menu clasico" [showgui "main"] 0

    if $VRHub_Comfort [
        guibar
        guilist [ guitext "brillo extra (%): " ; guislider vrbright 0 100 ]
        guilist [ guitext "foveado fijo (0 no .. 3 alto): " ; guislider vrfoveation 0 3 ]
        guilist [ guitext "tamano del panel: " ; guislider vrstatsscale 1 3 ]
    ]
] "" [VRHub_MapIndex = 0]
