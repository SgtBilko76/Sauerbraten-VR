//##############################################################################################################################################################
//##############################################################################################################################################################
nodebug [
    defvarp mainmenu_showlanconnect    0 1 1 // SauVREngine: servidor dedicado en la LAN (docs/servidor-dedicado.md)
    defvarp mainmenu_showconnectlocal  0 0 1
    defvarp mainmenu_showbotmatch      0 1 1
    defvarp mainmenu_showcampaign      0 0 1
    defvarp mainmenu_shownewmap        0 0 1
    defvarp mainmenu_showloadmap       0 0 1
    defvarp mainmenu_showloadcustommap 0 0 1
    defvarp mainmenu_showgetdemo       0 0 1
    defvarp mainmenu_showloaddemo      0 0 1
]

newgui "main" [
    guiscale 0.85

    guilist [// H
        guiimage (concatword "packages/icons/" (playermodelicon) ".jpg") [chooseplayermodel] 1.15
        guistrut 0.25
        guilist [// V
            MyName = $getname
            guilist [
                guifield MyName 15 [name $MyName]
                guibutton "kbd" [vkeyshift = 0; showgui "namekeyboard"] ""
            ]
            guispring
            guilist [// H
                guibutton (playermodelname) [chooseplayermodel] 0
                guistrut 1
                guiimage (getcrosshair) [showgui "crosshair"] 0.5
            ]
        ]
    ]

    guibar //===================================================================================================================================================
    guibutton "server browser" [showgui "serverbrowser"]
    if (|| $mainmenu_showlanconnect $mainmenu_showconnectlocal) [guistrut 0.333]
    if $mainmenu_showlanconnect   [guibutton [lanconnect]]
    if $mainmenu_showconnectlocal [guibutton [connect localhost]]

    guibar //===================================================================================================================================================
    if (ingame) [
        if (|| $editing [= $getmode 1]) [guibutton "editing"          [showgui "editing"]; guistrut 0.333]
        if (m_teammode $getmode)        [guibutton "switch team"      [switchteam]]
                                         guibutton "toggle spectator" [togglespectator]   "spectator_btn"
        if (ingamemp)                   [guibutton "master"           [showgui "master"]]
        guistrut 0.333
    ]
    if (ingamemp) [
        if $mainmenu_showgetdemo  [guibutton "get demo"  [getdemo]        ; guistrut 0.333]
    ][
        if $mainmenu_showloaddemo [guibutton "load demo" [showgui "demos"]; guistrut 0.333]
    ]
    if (! (ingame)) [
        if $mainmenu_showbotmatch [guibutton "bot match" [showgui "botmatch"]]
        if $mainmenu_showcampaign [guibutton "campaign"  [showgui "campaign"]]
        if (|| $mainmenu_showbotmatch $mainmenu_showcampaign) [guistrut 0.333]
    ]
    if (&& $mainmenu_shownewmap [|| [! (ingame)] [&& (ingame) $editing]]) [
        guibutton "new map" [newmap]
    ]
    if $mainmenu_showloadmap       [guibutton "load map"        [showgui "maps"]]
    if $mainmenu_showloadcustommap [guibutton "load custom map" [showgui "custommaps"]]

    guibar //===================================================================================================================================================
    guibutton "options" [showgui "options"]
    if (ingame) [
        guibutton "disconnect" [disconnect]    "exit"
    ][
        guibutton "about" [showgui "about"]
        guibutton "quit"  [quit]               "exit"
    ]
] 0


//##############################################################################################################################################################
//##############################################################################################################################################################
nodebug [
    defvar playermodelcount 1 5 0
]

macro GUI__playerbutton [cleargui 1; playermodel %1]

newgui "playermodel" [
    guiscale 0.85

    guilist [// H
        guilist [// V
            loop iMdl $playermodelcount [
                guibutton (playermodelname $iMdl) (GUI__playerbutton $iMdl) (playermodelicon $iMdl)
            ]
        ]
        guibar
        iMdl = (substr $guirolloveraction (strlen (GUI__playerbutton "")))
        iMdl = (max 0 (min (- $playermodelcount 1) $iMdl))
        guilist [// V
            guilist [// H
                guispring
                guiplayerpreview $iMdl 0 6 (checkrolloveraction "playermodel ") 4 1 (playermodelname $iMdl)
                guispring
            ]
            guitextbox (playermodelstory $iMdl) 40 9
        ]
    ]
] "" [guirolloveraction = (GUI__playerbutton $playermodel)]


//##############################################################################################################################################################
//##############################################################################################################################################################
newgui "serverbrowser" [
    guistayopen [
        guiservers [
            guialign 0 [
                guibutton "update from master server" updatefrommaster
                guistrut 4
                guicheckbox (concatword (? $autoupdateservers "" "^f9") "auto-update")  autoupdateservers
                guistrut 4
                guicheckbox (concatword (? $searchlan         "" "^f9") "search LAN" )  searchlan
                guistrut 4
                guicheckbox (concatword (? $autosortservers   "" "^f9") "auto-sort"  )  autosortservers
                if (! $autosortservers) [
                    guistrut 2
                    guibutton "sort" sortservers
                ]
            ]
            guibar
        ] 17
    ]
] "servers" [initservers]


//##############################################################################################################################################################
//##############################################################################################################################################################
// Runs once at startup: without any maprotation entries, the server's
// own "advance to the next map" logic (forcemap()/vote(), server.cpp,
// triggered once a timed bot match's intermission ends) finds nothing
// and falls through to loading a blank/edit map instead of a real one
// -- confirmed on-device as ending up on an empty test/template-looking
// map after a match. duel7 is the only map this project has actually
// verified performance on (see the full-content-beta performance note
// -- the other ~334 bundled community maps were never built/tested for
// this port and may run very differently), so the rotation deliberately
// stays scoped to just it for now rather than risking an unverified,
// possibly much heavier map loading automatically after every match.
maprotation "ffa" "duel7 ruebli"

nodebug [
    defvar GUI_BotCount 1   5  32
    defvar GUI_MinSkill 1  50 101
    defvar GUI_MaxSkill 1 100 101
]
newgui "botmatch" [
    guiscale 0.85

    guitext "bot amount"
    guislider GUI_BotCount 1 32
    guitext "bot minimum skill"
    guislider GUI_MinSkill 50 101 [if (< $GUI_MaxSkill $GUI_MinSkill) [GUI_MaxSkill = $GUI_MinSkill]]
    guitext "bot maximum skill"
    guislider GUI_MaxSkill 50 101 [if (> $GUI_MinSkill $GUI_MaxSkill) [GUI_MinSkill = $GUI_MaxSkill]]
    guibutton "choose map" [showgui "botmatchmaps"]
] "bot match"

// Every stock map is bundled now (see the full-content beta note), so
// bot matches get a real map picker instead of the single hardcoded
// duel7 this used to be -- reuses guimaplist/GUI__MapList's own
// thumbnail/tab UI (_utility.cfg) via GUI__MapListClickAction rather
// than its normal "mode $ML_Mode; map <name>" click behavior, since bot
// matches are always FFA (the mode-radio UI those normally drive doesn't
// apply here) and need the extra spawn-race/fog/bot-adding steps below
// that a bare "map" command doesn't do on its own.
newgui "botmatchmaps" [
    guiscale 0.85
    guikeeptab 1
    GUI__MapListClickAction = "GUI__StartBotMatchWithMap"
    guimaplist 15 17 3 "ffa" $MapList_DM  "capture" $MapList_CAP  "ctf" $MapList_CTF  "concept" $MapList_Concept
    GUI__MapListClickAction = ""
] "choose a map" [ML_MapName ""]

GUI__StartBotMatchWithMap = [
    if (ingamemp) [
        echo "You must disconnect from the current multiplayer game before starting a bot match."
    ][
        // The original "pick a map" flow (_utility.cfg's GUI__MapList,
        // guibutton action) always does "mode <n>; map <name>" together --
        // omitting the mode leaves whatever mode last happened to be set
        // (defaults to "coop edit", mode 1, which ignores the map's real
        // FFA spawn entities and drops the player at an arbitrary point --
        // confirmed on-device as the cause of spawning outside the map).
        // 0 is "ffa" in game.h's gamemodes[] (indexed from STARTGAMEMODE=-3).
        mode 0
        map $arg1
        // Pushes the visual fade-to-fog-color distance well past the
        // map's own baked-in setting -- purely cosmetic (the far clip
        // plane is already worldsize*2 in gl_drawframe(), so geometry
        // within the map was always actually rendered; this just
        // controls how far away it fades into the fog color before
        // that). Requested: a more distanced view without touching
        // gameplay/collision.
        fog 10000
        // The player's own initial spawn (chosen internally while "map"
        // above was still executing) races ahead of the map's entity
        // list finishing loading on this build -- confirmed on-device
        // via a temporary diagnostic: findplayerspawn() found 0
        // candidate playerstart entities at that point and fell back to
        // the map's exact center, floating outside the level. Entities
        // ARE loaded just a bit later -- a follow-up "suicide" reliably
        // fixes it (relies on attackspawn's normal auto-respawn-on-
        // attack, calling findplayerspawn() again), but "suicide"
        // (fps.cpp) is *networked* (addmsg(N_SUICIDE,...), since FFA
        // isn't an M_LOCAL mode even in a local bot match) -- queuing it
        // and the addbot loop below back to back in this same
        // synchronous block, with no real game tick in between to
        // actually flush/process that message, meant it never took
        // effect (confirmed on-device: still broken with no sleep).
        // sleep (cubescript, genuinely deferred/async, unlike this
        // block's otherwise-synchronous execution) forces real ticks to
        // pass between each step so the network message queued by each
        // one actually gets processed before the next runs.
        sleep 500 [
            suicide
            sleep 500 [
                loop i $GUI_BotCount [
                    addbot (rnd (+ $GUI_MaxSkill 1) $GUI_MinSkill)
                ]
            ]
        ]
    ]
]


